[workspace]
authors = ["ampregnall <ampregnall@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "copd-asthma-gwas-nf"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
r = ">=4.5,<4.6"
"r-data.table" = ">=1.18.4,<2"
r-jsonlite = ">=2.0.0,<3"
r-rlang = ">=1.3.0,<2"
r-languageserver = ">=0.3.18,<0.4"
r-glue = ">=1.8.1,<2"
r-tidyverse = ">=2.0.0,<3"
r-argparse = ">=2.3.1,<3"
r-ggrepel = ">=0.9.8,<0.10"

[environments]
prs-clustering = ["prs"]
gsea = ["gsea"]

[feature.prs.dependencies]
python = "3.11.*"
tqdm = ">=4.70.0,<5"
pandas = ">=3.0.5,<4"
numpy = ">=2.4.6,<3"
plotnine = ">=0.15.8,<0.16"
scikit-learn = ">=1.9.0,<2"

[feature.gsea.dependencies]
bioconductor-clusterprofiler = ">=4.18.4,<5"
r-tidyverse = ">=2.0.0,<3"
bioconductor-enrichplot = ">=1.30.4,<2"
